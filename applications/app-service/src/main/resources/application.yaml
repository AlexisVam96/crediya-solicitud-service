server:
  port: 8081
  error:
    include-message: "always"
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: "crediya-solicitud-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
springdoc:
  swagger-ui:
    enabled: true
    path: "/swagger-ui.html"
  api-docs:
    enabled: true
    path: "/v3/api-docs"
  default-produces-media-type: "application/json"
adapter:
  restconsumer:
    timeout: 5000
    url: "http://${SERVICE_AUTHENTICATION:localhost}"
    #url: "http://${SERVICE_AUTHENTICATION:localhost}:8080"
  sqs:
    region: "us-east-2"
    queueUrl: "https://sqs.us-east-2.amazonaws.com/818084701499/solicitudes-queue"
    debt-capacity:
      region: "us-east-2"
      queueUrl: "https://sqs.us-east-2.amazonaws.com/818084701499/debt-capacity-queue"
    estado-solicitud:
      region: "us-east-2"
      queueUrl: "https://sqs.us-east-2.amazonaws.com/818084701499/estado-solicitud-queue"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
jwt:
  secret: "mysupersecretkey-crediya-1234567890"
  expiration: 3600000
db:
  host: "${SPRING_R2DBC_HOST_LOANAPPLICATION:localhost}"
entrypoint:
  sqs:
    region: "us-east-2"
    endpoint: "https://sqs.us-east-2.amazonaws.com"
    queueUrl: "https://sqs.us-east-2.amazonaws.com/818084701499/reply-dept-capacity-queue"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeout: 10000
    numberOfThreads: 1
